<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จุดสแกน Check-in ฐานกิจกรรม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800&family=Sarabun:wght@400;500;600;700&family=Bai+Jamjuree:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
  :root{
    --ink:#16261F;
    --forest:#24463A;
    --forest-dark:#182F26;
    --canvas:#EFEAD9;
    --canvas-card:#FBF8F0;
    --brass:#B8863B;
    --brass-dark:#8E6427;
    --moss:#6B8F71;
    --moss-dark:#4F7857;
    --ember:#C1443B;
    --ember-dark:#9A342C;
    --mist:#D8DED2;
    --stone:#B9AFA2;
  }
  *{ -webkit-tap-highlight-color: transparent; }
  body{
    font-family:'Sarabun',sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(184,134,59,0.10), transparent 40%),
      repeating-linear-gradient(115deg, rgba(36,70,58,0.05) 0px, rgba(36,70,58,0.05) 1px, transparent 1px, transparent 34px),
      var(--canvas);
    color: var(--ink);
    min-height:100vh;
  }
  .font-display{ font-family:'Kanit',sans-serif; }
  .font-code{ font-family:'Bai Jamjuree',monospace; letter-spacing:.03em; }

  .badge-ring{
    background: conic-gradient(from 0deg, var(--brass), var(--moss), var(--brass));
  }

  .viewfinder{ position:relative; }
  .viewfinder::before, .viewfinder::after,
  .vf-tl, .vf-br{ content:""; }
  .vf-corner{
    position:absolute; width:22px; height:22px; border-color: var(--brass);
    z-index:10; pointer-events:none;
  }
  .vf-tl{ top:8px; left:8px; border-top:3px solid; border-left:3px solid; border-radius:6px 0 0 0; }
  .vf-tr{ top:8px; right:8px; border-top:3px solid; border-right:3px solid; border-radius:0 6px 0 0; }
  .vf-bl{ bottom:8px; left:8px; border-bottom:3px solid; border-left:3px solid; border-radius:0 0 0 6px; }
  .vf-br{ bottom:8px; right:8px; border-bottom:3px solid; border-right:3px solid; border-radius:0 0 6px 0; }

  .btn-primary{
    background: linear-gradient(180deg, var(--moss), var(--moss-dark));
    box-shadow: 0 3px 0 var(--moss-dark), 0 8px 18px -6px rgba(79,120,87,.55);
  }
  .btn-primary:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--moss-dark); }
  .btn-dark{
    background: linear-gradient(180deg, var(--forest), var(--forest-dark));
    box-shadow: 0 3px 0 var(--forest-dark);
  }
  .btn-dark:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--forest-dark); }

  .spinner{ border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; width:16px; height:16px; animation: spin .7s linear infinite; }
  .spinner-dark{ border:3px solid rgba(36,70,58,.15); border-top-color: var(--forest); }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .stamp{
    border: 3px solid var(--moss-dark);
    outline: 3px solid var(--moss-dark);
    outline-offset: 4px;
    border-radius: 9999px;
    color: var(--moss-dark);
    animation: stampIn .38s cubic-bezier(.2,1.4,.4,1) both;
  }
  .stamp.fail{ border-color: var(--ember-dark); outline-color: var(--ember-dark); color: var(--ember-dark); }
  @keyframes stampIn{
    0%{ transform: scale(1.6) rotate(-14deg); opacity:0; }
    70%{ transform: scale(0.94) rotate(-8deg); opacity:1; }
    100%{ transform: scale(1) rotate(-8deg); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .stamp{ animation: none; transform: rotate(-8deg); }
    *{ transition: none !important; }
  }

  .fade-in{ animation: fadeIn .25s ease both; }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform:none; } }

  #reader video{ border-radius: 12px; }
</style>
</head>
<body>

  <!-- Loading Overlay (เฉพาะช่วงตรวจสอบสำคัญ) -->
  <div id="loading-overlay" class="hidden fixed inset-0 bg-[#16261F]/55 backdrop-blur-sm flex flex-col items-center justify-center z-50">
    <div class="bg-[var(--canvas-card)] px-6 py-5 rounded-2xl shadow-2xl flex flex-col items-center gap-3">
      <div class="spinner spinner-dark w-9 h-9"></div>
      <p class="text-sm font-semibold font-display text-[var(--forest)]">กำลังตรวจสอบข้อมูล...</p>
    </div>
  </div>

  <div class="max-w-md mx-auto p-4 space-y-4">

    <!-- Header -->
    <header class="rounded-2xl overflow-hidden shadow-lg mt-4" style="background: linear-gradient(160deg, var(--forest), var(--forest-dark));">
      <div class="px-5 py-4 flex items-center gap-3">
        <div class="w-11 h-11 rounded-full badge-ring p-[2px] shrink-0">
          <div class="w-full h-full rounded-full bg-[var(--forest-dark)] flex items-center justify-center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2 3 6.5v6C3 17 6.6 20.7 12 22c5.4-1.3 9-5 9-9.5v-6L12 2Z" stroke="#EFEAD9" stroke-width="1.6" stroke-linejoin="round"/><path d="m12 8 2.2 4.4L9 15l3-7Z" fill="#B8863B"/></svg>
          </div>
        </div>
        <div>
          <h1 class="font-display font-bold text-lg text-white leading-tight">จุดสแกน Check-in</h1>
          <p class="text-[11px] text-[#C9D6CC] font-code">CHECKPOINT · ฐานกิจกรรม</p>
        </div>
      </div>
      <div class="px-5 pb-3">
        <a href="#" onclick="backToAdmin(); return false;" class="text-[11px] text-[#C9D6CC]/80 hover:text-white underline underline-offset-2">← กลับสู่ระบบหลังบ้าน</a>
      </div>
    </header>

    <!-- Scanner -->
    <div id="step-scan" class="fade-in bg-[var(--canvas-card)] p-4 rounded-2xl shadow-md space-y-4 border border-[var(--mist)]">
      <h2 class="font-display font-semibold text-center text-[var(--forest)] text-sm tracking-wide">สแกน QR CODE ใบจอง</h2>
      <div class="viewfinder rounded-xl overflow-hidden bg-black">
        <div id="reader"></div>
        <div class="vf-corner vf-tl"></div>
        <div class="vf-corner vf-tr"></div>
        <div class="vf-corner vf-bl"></div>
        <div class="vf-corner vf-br"></div>
      </div>
      <div class="text-center">
        <p class="text-xs text-[var(--stone)] mb-2">หรือกรอกรหัสการจองด้วยตนเอง</p>
        <div class="flex gap-2">
          <input type="text" id="manual-booking-id" placeholder="BK-xxxxxxxxxx"
            class="flex-1 p-2.5 border border-[var(--mist)] rounded-lg text-sm font-code bg-white focus:outline-none focus:ring-2 focus:ring-[var(--brass)]/50 focus:border-[var(--brass)]">
          <button id="btn-manual" onclick="manualCheckIn()"
            class="btn-primary text-white px-4 py-2.5 rounded-lg text-sm font-display font-bold flex items-center gap-2">
            <span>ยืนยัน</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Result -->
    <div id="checkin-result" class="hidden fade-in bg-[var(--canvas-card)] p-6 rounded-2xl shadow-md text-center space-y-4 border border-[var(--mist)]"></div>
  </div>

<script>
  // อ่านค่า apiUrl จาก query string ก่อนเสมอ — หน้า Admin (openCheckinPortal) จะแนบ URL ของ
  // Web App เวอร์ชันที่ deploy อยู่จริง ณ ขณะนั้นมาให้ทาง query string นี้ทุกครั้งที่กดเปิดหน้านี้
  // (เดิมโค้ดจุดนี้มองข้ามค่าที่ Admin ส่งมา ใช้ URL ที่ hardcode ไว้ตายตัวเสมอ)
  const FALLBACK_API_URL = "https://script.google.com/a/macros/nmu.ac.th/s/AKfycbycMIp68Coi51JSZwX5lrpjd_8ecy_Qrkewx81o7j85nzR4WZgVaUYNnMSWlKvuhnBxCQ/exec";
  const API_URL = new URLSearchParams(window.location.search).get('apiUrl') || FALLBACK_API_URL;
  const ADMIN_URL = API_URL;

  function backToAdmin(){ window.location.href = ADMIN_URL; }

  function toggleLoading(show){
    const el = document.getElementById('loading-overlay');
    if (el) el.classList.toggle('hidden', !show);
  }

  function setButtonBusy(btn, busy, label){
    if (!btn) return;
    if (busy){
      btn.dataset.label = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span><span>${label || 'กำลังทำรายการ'}</span>`;
    } else {
      btn.disabled = false;
      if (btn.dataset.label) btn.innerHTML = btn.dataset.label;
    }
  }

  // Initialize QR Scanner
  const html5QrCode = new Html5Qrcode("reader");
  function startScanner(){
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 12, qrbox: 220, aspectRatio: 1.0 },
      onScanSuccess
    ).catch(err => console.log("กล้องไม่สามารถใช้งานได้ หรือยังไม่ได้อนุญาตสิทธิ์:", err));
  }
  startScanner();

  function stopCamera(){
    if (html5QrCode && html5QrCode.isScanning){
      html5QrCode.stop().catch(err => console.error("Error stopping scanner:", err));
    }
  }

  function onScanSuccess(decodedText){
    stopCamera();
    document.getElementById('step-scan').classList.add('hidden');
    runCheckIn(decodedText);
  }

  function manualCheckIn(){
    const input = document.getElementById('manual-booking-id');
    const val = input.value.trim();
    if (!val){ input.focus(); return; }
    stopCamera();
    document.getElementById('step-scan').classList.add('hidden');
    runCheckIn(val);
  }
  document.getElementById('manual-booking-id').addEventListener('keydown', e => {
    if (e.key === 'Enter') manualCheckIn();
  });

  async function runCheckIn(bookingId){
    const res = await callAPI({ action: 'checkInBooking', bookingId: bookingId });
    const box = document.getElementById('checkin-result');
    box.classList.remove('hidden');

    if (res.success){
      const mismatchBanner = res.dateMismatch ? `
        <div class="text-left text-xs font-semibold rounded-lg px-3 py-2.5 border" style="background:#FDF1D8;border-color:var(--brass);color:var(--brass-dark);">
          ⚠ รอบนี้กำหนดไว้วันที่ ${escapeHtml(formatThaiDate(res.slotDate))} ไม่ใช่วันนี้ — โปรดตรวจสอบก่อนอนุญาตเข้าฐาน
        </div>` : '';
      box.innerHTML = `
        <div class="mx-auto w-20 h-20 stamp flex items-center justify-center font-display font-extrabold text-2xl">✓</div>
        <h2 class="font-display text-xl font-bold text-[var(--moss-dark)]">${escapeHtml(res.message)}</h2>
        ${mismatchBanner}
        <div class="bg-[var(--canvas)] p-4 rounded-xl text-left text-sm space-y-1.5 border border-[var(--mist)]">
          <p><span class="text-[var(--stone)]">ชื่อ:</span> <b>${escapeHtml(res.name)}</b></p>
          <p><span class="text-[var(--stone)]">ฐาน:</span> <b>${escapeHtml(res.baseName)}</b></p>
          <p><span class="text-[var(--stone)]">วันที่/เวลา:</span> <b>${escapeHtml(formatThaiDate(res.slotDate))} · ${escapeHtml(res.slotTime)}</b></p>
          <p><span class="text-[var(--stone)]">ที่นั่ง:</span> <span class="font-code font-bold text-lg text-[var(--brass-dark)]">${escapeHtml(res.seat)}</span></p>
        </div>
        <button onclick="scanNext()" class="w-full btn-dark text-white py-3 rounded-xl font-display font-bold">สแกนคนถัดไป</button>
      `;
    } else {
      box.innerHTML = `
        <div class="mx-auto w-20 h-20 stamp fail flex items-center justify-center font-display font-extrabold text-2xl">✕</div>
        <h2 class="font-display text-lg font-bold text-[var(--ember-dark)]">${escapeHtml(res.message)}</h2>
        <button onclick="scanNext()" class="w-full btn-dark text-white py-3 rounded-xl font-display font-bold">ลองใหม่อีกครั้ง</button>
      `;
    }
  }

  function scanNext(){
    const box = document.getElementById('checkin-result');
    box.classList.add('hidden');
    box.innerHTML = '';
    document.getElementById('manual-booking-id').value = '';
    const step = document.getElementById('step-scan');
    step.classList.remove('hidden');
    step.classList.add('fade-in');
    startScanner();
  }

  function escapeHtml(str){
    return String(str === undefined || str === null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // แปลง 'yyyy-MM-dd' เป็นวันที่แบบไทยอ่านง่าย (เช่น 12 ส.ค. 2569) — คืน '-' ถ้ายังไม่มีค่า
  // (รองรับรอบเก่าที่สร้างไว้ก่อนมีคอลัมน์วันที่) หรือคืนค่าดิบถ้ารูปแบบไม่ตรงตามที่คาด
  function formatThaiDate(dateStr){
    if (!dateStr) return '-';
    const m = String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return dateStr;
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  async function callAPI(data, silent = false){
    if (!silent) toggleLoading(true);
    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        redirect: 'follow',
        body: JSON.stringify(data)
      });
      const result = await response.json();
      if (!silent) toggleLoading(false);
      return result;
    } catch (error) {
      if (!silent) toggleLoading(false);
      console.error("API Call Error:", error);
      return { success: false, message: "ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง" };
    }
  }
</script>
</body>
</html>
